server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/koole_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  secret: your-jwt-secret-key-at-least-256-bits-long
  expiration: 86400000
